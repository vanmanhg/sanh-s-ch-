<!doctype html>

    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('nongtro_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var activeTheme = (savedTheme === 'dark' || savedTheme === 'light') ? savedTheme : (prefersDark ? 'dark' : 'light');
          if (activeTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
          var savedLang = localStorage.getItem('nongtro_lang');
          if (savedLang === 'vi' || savedLang === 'en' || savedLang === 'zh' || savedLang === 'km' || savedLang === 'ja') {
            document.documentElement.lang = savedLang;
          } else {
            document.documentElement.lang = 'vi';
          }
        } catch (err) {}
      })();
    </script>
    <script>
      (function() {
        var _err = console.error;
        console.error = function() {
          var msg = Array.prototype.slice.call(arguments).map(String).join(' ');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) return;
          if (
            msg.indexOf('InvalidKeyMapError') !== -1 ||
            msg.indexOf('ApiProjectMapError') !== -1 ||
            msg.indexOf('gm_authFailure') !== -1 ||
            msg.indexOf('developers.google.com/maps') !== -1
          ) {
            try {
              window.dispatchEvent(new CustomEvent('gmp-auth-failed'));
            } catch (err) {}
            return;
          }
          _err.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (!e) return;
          var msg = e.message || '';
          if (
            msg === 'Script error.' ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('InvalidKeyMapError') !== -1 ||
            msg.indexOf('Google Maps') !== -1 ||
            msg.indexOf('maps.googleapis') !== -1
          ) {
            try {
              window.dispatchEvent(new CustomEvent('gmp-auth-failed'));
            } catch (err) {}
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
